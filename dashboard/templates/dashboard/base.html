{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}NPFL All-Time Analytics{% endblock %}</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- html2canvas: powers the admin-only "Download PNG" buttons on charts/tables -->
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <!-- Shared PNG exporter (also used by the Super Computer page) -->
    <script src="{% static 'png_export.js' %}"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'dashboard/style.css' %}">
    <!-- Theme toggle (loaded early to prevent flash) -->
    <script src="{% static 'theme.js' %}"></script>
</head>
<body>
    <div class="app-container">
        {% block content %}
        {% endblock %}
    </div>
    <!-- Footer -->
    <footer class="site-footer">
        <p>
            For feedback and enquiries:
            <a href="mailto:team@madeinafricasport.com">
                team@madeinafricasport.com
            </a>
            <span class="footer-separator">|</span>
            WhatsApp:
            <a href="https://wa.me/2348032329567" target="_blank">
                +234 803 232 9567
            </a>
        </p>
    </footer>
    {% block scripts %}
    {% endblock %}
</body>
</html>
