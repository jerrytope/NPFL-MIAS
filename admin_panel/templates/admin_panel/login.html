{% load static %}
<!DOCTYPE html>
<!-- data-theme is set here so the pre-JS paint is light; theme.js overrides it for anyone who chose dark. -->
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — NPFL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Theme toggle (loaded early to prevent flash of wrong theme) -->
    <script src="{% static 'theme.js' %}"></script>
    <style>
        /* ============================================================
           NPFL Admin Login — Theme-aware styles
           Default: dark. Light mode via [data-theme="light"]
           ============================================================ */

        :root {
            --login-bg: #0a0e1a;
            --login-card: rgba(17, 24, 39, 0.9);
            --login-border: rgba(255, 255, 255, 0.07);
            --login-text: #f1f5f9;
            --login-text-muted: #94a3b8;
            --login-primary: #38bdf8;
            --login-primary-hover: #7dd3fc;
            --login-danger: #f87171;
            --login-input-bg: rgba(255, 255, 255, 0.05);
            --login-input-border: rgba(255, 255, 255, 0.1);
            --login-input-focus-shadow: rgba(56, 189, 248, 0.12);
            --login-shadow: 0 8px 40px rgba(0, 0, 0, 0.4);
            --font: 'Inter', sans-serif;
        }

        /* Light mode overrides */
        [data-theme="light"] {
            --login-bg: #f8fafc;
            --login-card: rgba(255, 255, 255, 0.98);
            --login-border: rgba(0, 0, 0, 0.08);
            --login-text: #111827;
            --login-text-muted: #64748b;
            --login-primary: #0ea5e9;
            --login-primary-hover: #0284c7;
            --login-danger: #e11d48;
            --login-input-bg: rgba(0, 0, 0, 0.03);
            --login-input-border: rgba(0, 0, 0, 0.12);
            --login-input-focus-shadow: rgba(14, 165, 233, 0.1);
            --login-shadow: 0 8px 40px rgba(0, 0, 0, 0.08);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: var(--font);
            background: var(--login-bg);
            color: var(--login-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(56, 189, 248, 0.06) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(167, 139, 250, 0.05) 0%, transparent 60%);
            transition: background-color 0.2s ease;
        }

        [data-theme="light"] body {
            background-image:
                radial-gradient(ellipse at 20% 50%, rgba(14, 165, 233, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(124, 58, 237, 0.03) 0%, transparent 60%);
        }

        /* Theme toggle top-right */
        .login-theme-toggle {
            position: fixed;
            top: 16px;
            right: 20px;
        }

        .theme-toggle-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8125rem;
            font-weight: 600;
            font-family: var(--font);
            cursor: pointer;
            border: 1px solid var(--login-input-border);
            background: var(--login-input-bg);
            color: var(--login-text-muted);
            transition: all 0.2s ease;
            white-space: nowrap;
            user-select: none;
        }

        .theme-toggle-btn:hover {
            border-color: var(--login-primary);
            color: var(--login-primary);
            background: rgba(56, 189, 248, 0.08);
        }

        [data-theme="light"] .theme-toggle-btn:hover {
            background: rgba(14, 165, 233, 0.08);
        }

        .theme-toggle-btn i {
            font-size: 0.8rem;
            transition: transform 0.3s ease;
        }

        .theme-toggle-btn:hover i {
            transform: rotate(20deg);
        }

        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 20px;
        }

        .login-card {
            background: var(--login-card);
            border: 1px solid var(--login-border);
            border-radius: 18px;
            padding: 44px 36px 36px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: var(--login-shadow);
            transition: background 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .login-brand {
            text-align: center;
            margin-bottom: 36px;
        }

        .login-brand .brand-icon {
            width: 60px;
            height: 60px;
            border-radius: 16px;
            background: rgba(56, 189, 248, 0.1);
            border: 1px solid rgba(56, 189, 248, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        [data-theme="light"] .login-brand .brand-icon {
            background: rgba(14, 165, 233, 0.08);
            border-color: rgba(14, 165, 233, 0.2);
        }

        .login-brand .brand-icon i {
            font-size: 28px;
            color: var(--login-primary);
        }

        .login-brand h1 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
            color: var(--login-text);
            letter-spacing: -0.01em;
        }

        .login-brand p {
            font-size: 13px;
            color: var(--login-text-muted);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
            color: var(--login-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 13px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 13px;
            color: var(--login-text-muted);
            pointer-events: none;
        }

        .form-group input {
            width: 100%;
            padding: 10px 14px 10px 38px;
            border-radius: 9px;
            border: 1px solid var(--login-input-border);
            background: var(--login-input-bg);
            color: var(--login-text);
            font-size: 14px;
            font-family: var(--font);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background 0.2s;
        }

        .form-group input::placeholder {
            color: var(--login-text-muted);
            opacity: 0.6;
        }

        .form-group input:focus {
            border-color: var(--login-primary);
            box-shadow: 0 0 0 3px var(--login-input-focus-shadow);
            background: var(--login-input-bg);
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 9px;
            background: var(--login-primary);
            color: #0a0e1a;
            font-size: 14px;
            font-weight: 700;
            font-family: var(--font);
            cursor: pointer;
            transition: background 0.2s, box-shadow 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 8px;
        }

        .btn-login:hover {
            background: var(--login-primary-hover);
            box-shadow: 0 0 20px rgba(56, 189, 248, 0.25);
            transform: translateY(-1px);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        [data-theme="light"] .btn-login:hover {
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2);
        }

        .error-msg {
            background: rgba(248, 113, 113, 0.1);
            border: 1px solid rgba(248, 113, 113, 0.2);
            color: var(--login-danger);
            padding: 10px 14px;
            border-radius: 9px;
            font-size: 13px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        [data-theme="light"] .error-msg {
            background: rgba(225, 29, 72, 0.08);
            border-color: rgba(225, 29, 72, 0.2);
        }

        .login-footer {
            text-align: center;
            margin-top: 24px;
        }

        .login-footer a {
            color: var(--login-text-muted);
            text-decoration: none;
            font-size: 13px;
            transition: color 0.2s;
        }

        .login-footer a:hover {
            color: var(--login-primary);
        }

        /* Smooth transitions */
        *, *::before, *::after {
            transition: background-color 0.2s ease, border-color 0.2s ease, color 0.15s ease;
        }
    </style>
</head>
<body>
    <!-- Theme toggle (fixed position, top-right) -->
    <div class="login-theme-toggle">
        <button class="theme-toggle-btn" id="themeToggle" title="Switch to dark mode">
            <i class="fas fa-moon"></i>
            <span class="theme-label">Dark</span>
        </button>
    </div>

    <div class="login-container">
        <div class="login-card">
            <div class="login-brand">
                <div class="brand-icon">
                    <i class="fas fa-shield-halved"></i>
                </div>
                <h1>NPFL Admin</h1>
                <p>Sign in to manage predictions &amp; reports</p>
            </div>

            {% if error %}
            <div class="error-msg">
                <i class="fas fa-exclamation-circle"></i>
                {{ error }}
            </div>
            {% endif %}

            <form method="post" action="{% url 'admin_login' %}{% if request.GET.next %}?next={{ request.GET.next }}{% endif %}">
                {% csrf_token %}
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fas fa-user"></i>
                        <input type="text" id="username" name="username" placeholder="Enter your username" autofocus required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" name="password" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="btn-login">
                    <i class="fas fa-right-to-bracket"></i>
                    Sign In
                </button>
            </form>
        </div>
        <div class="login-footer">
            <a href="/"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>
    </div>
</body>
</html>
